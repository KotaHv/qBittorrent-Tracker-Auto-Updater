[project]
name = "qbittorrent-tracker-auto-updater"
version = "0.6.2"
description = "qBittorrent Automatically Updates Trackers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "qbittorrent-api>=2026.6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = [
    # E501: https://beta.ruff.rs/docs/rules/line-too-long/
    'E501',
    # F401: https://beta.ruff.rs/docs/rules/unused-import/
    # avoid unused imports lint in `__init__.py`
    # 'F401',
]

select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
]

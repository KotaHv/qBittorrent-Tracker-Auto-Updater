version: "3"

services:
  qb-tracker-update:
    image: ghcr.io/kotahv/qb-tracker-update:latest
    container_name: qb-tracker-update
    environment:
      # - trackers=
      # - tracker_sources=https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt\nhttps://raw.githubusercontent.com/XIU2/TrackersListCollection/master/best.txt
      - qb_host=http://host:8080 # Required: qBittorrent WebUI URL (include http:// or https://)
      - qb_username=username # Optional: leave empty if qBittorrent whitelists this IP
      - qb_password=pwd # Optional: leave empty if qBittorrent whitelists this IP
      # - qb_api_key=qbt_xxxx # Optional (v5.2.0+): takes precedence over username/password
      # - proxy=http://host:port # Optional: proxy for fetching tracker lists
      # - log_level=info
      # - interval=3600
      # - PUID=1000 # Host user ID owning ./data; entrypoint remaps the container user to it
      # - PGID=1000
      # - UMASK=022
      # state_file defaults to /app/data/trackers_state.json (inside the mounted ./data volume);
      # uncomment to override
      # - state_file=/app/data/trackers_state.json
    # restart: always is safe: when the app cannot start because of a
    # qBittorrent error (rejected login, bad host, connection problem) it stays
    # alive and waits instead of exiting, so Docker cannot restart-loop and
    # trigger qBittorrent's temporary IP ban.
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/app/data
